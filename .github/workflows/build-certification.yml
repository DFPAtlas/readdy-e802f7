name: DFP Build Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: UAT application regression tests
        run: npm run test:uat-application
      - name: Sandbox authentication regression tests
        run: npm run test:security
      - name: Website discovery regression tests
        run: npm run test:website-discovery
      - name: Payment regression tests
        run: npm run test:payments
      - name: Server route authorization regression tests
        run: npm run test:route-security
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:smoke
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dfp-browser-smoke-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
